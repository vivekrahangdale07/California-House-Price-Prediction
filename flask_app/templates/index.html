<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California House Price Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>California House Price Prediction</h1>
            <p>
                Predict the estimated house value using a Machine Learning model.
            </p>
        </div>


        <div class="card">

            <h2>Property Details</h2>

            <form action="/predict" method="POST">

                <div class="form-grid">

                    <div class="input-group">
                        <label>Longitude</label>
                        <input
                            type="number"
                            step="any"
                            name="longitude"
                            placeholder="e.g. -122.23"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Latitude</label>
                        <input
                            type="number"
                            step="any"
                            name="latitude"
                            placeholder="e.g. 37.88"
                            required>
                    </div>


                    <div class="input-group">
                        <label>Housing Median Age</label>
                        <input
                            type="number"
                            step="any"
                            name="housing_median_age"
                            placeholder="e.g. 41"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Total Rooms</label>
                        <input
                            type="number"
                            step="any"
                            name="total_rooms"
                            placeholder="e.g. 880"
                            required>
                    </div>


                    <div class="input-group">
                        <label>Total Bedrooms</label>
                        <input
                            type="number"
                            step="any"
                            name="total_bedrooms"
                            placeholder="e.g. 129"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Population</label>
                        <input
                            type="number"
                            step="any"
                            name="population"
                            placeholder="e.g. 322"
                            required>
                    </div>


                    <div class="input-group">
                        <label>Households</label>
                        <input
                            type="number"
                            step="any"
                            name="households"
                            placeholder="e.g. 126"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Median Income</label>
                        <input
                            type="number"
                            step="any"
                            name="median_income"
                            placeholder="e.g. 8.3252"
                            required>
                    </div>

                </div>


                <div class="input-group full-width">

                    <label>Ocean Proximity</label>

                    <select name="ocean_proximity" required>

                        <option value="" disabled selected>
                            Select ocean proximity
                        </option>

                        <option value="&lt;1H OCEAN">
                            &lt;1H OCEAN
                        </option>

                        <option value="INLAND">
                            INLAND
                        </option>

                        <option value="NEAR OCEAN">
                            NEAR OCEAN
                        </option>

                        <option value="NEAR BAY">
                            NEAR BAY
                        </option>

                        <option value="ISLAND">
                            ISLAND
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Predict House Price
                </button>

            </form>

        </div>


        {% if prediction %}

        <div class="result-card">

            <p>Estimated House Value</p>

            <h2>{{ prediction }}</h2>

            <span>Random Forest Regression Model</span>

        </div>

        {% endif %}


        <div class="footer">

            <p>
                Built with Python • Flask • Pandas • Scikit-learn
            </p>

        </div>

    </div>

</body>

</html>
